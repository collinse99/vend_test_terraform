name: Guardian Storage Terraform

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

concurrency:
  group: guardian-storage-terraform

jobs:
  terraform:
    name: Guardian Storage Terraform ${{ inputs.terraform_action }}
    runs-on: ubuntu-latest
    environment: sandbox

    env:
      TF_VAR_storage_account_name: ${{ vars.GUARDIAN_STORAGE_ACCOUNT_NAME }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: azurecloud

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.6

      - name: Initialize Terraform
        run: terraform -chdir=Guardian_Deployment init -input=false

      - name: Validate Terraform
        run: terraform -chdir=Guardian_Deployment validate

      - name: Create Terraform plan
        run: terraform -chdir=Guardian_Deployment plan -input=false -out=tfplan

      - name: Apply Terraform plan
        if: inputs.terraform_action == 'apply'
        run: terraform -chdir=Guardian_Deployment apply -input=false tfplan
